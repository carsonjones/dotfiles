onboarding = false

[keys]
previous_agent = "shift+alt+["
next_agent = "shift+alt+]"
previous_tab = "alt+["
next_tab = "alt+]"

# alt+1..9 focuses tab N within the active workspace (herdr appends 1..9).
[keys.indexed]
tabs = "alt"

# tiles plugin (herdr/plugins/tiles): tile the current pane.
#   prefix+y = horizontal, prefix+u = vertical.
#   +shift "flips" the big/small side; +alt "reverts" to an even 50/50 split.
[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "local.tiles.h-wide"
description = "tile: horizontal, current 6/10 left"

[[keys.command]]
key = "prefix+shift+y"
type = "plugin_action"
command = "local.tiles.h-narrow"
description = "tile: horizontal flip, current 4/10 left"

[[keys.command]]
key = "prefix+alt+y"
type = "plugin_action"
command = "local.tiles.h-even"
description = "tile: horizontal revert, even 50/50"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "local.tiles.v-top-small"
description = "tile: vertical, current 1/5 top"

[[keys.command]]
key = "prefix+shift+u"
type = "plugin_action"
command = "local.tiles.v-top-large"
description = "tile: vertical flip, current 4/5 top"

[[keys.command]]
key = "prefix+alt+u"
type = "plugin_action"
command = "local.tiles.v-even"
description = "tile: vertical revert, even 50/50"

[theme]
name = "one-dark"

# Override individual color tokens on top of the base theme.
# Selected workspace / agent rows pick up `surface0` (subtle row highlight)
# and the `accent` color for borders/markers. Tweak these to make selection
# pop against your shell background.
[theme.custom]
# Sidebar selected workspace / agent row highlight (`surface_dim`).
# Slightly darker than the panel so selection reads even with terminal opacity.
surface_dim = "#1f232a"  # selected sidebar row background
accent = "#61afef"        # selection border + nav accents (one-dark blue)

[ui]
agent_panel_scope = "all"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = false

[session]
# Restore supported AI-agent panes (Claude Code, Codex, Pi, etc.) into their
# native conversation sessions after a herdr server restart.
resume_agents_on_restore = true

[experimental]
# Save recent pane screen history across full server restarts.
pane_history = true
