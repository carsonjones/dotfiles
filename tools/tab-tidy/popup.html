<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body { font: 13px system-ui, sans-serif; width: 260px; margin: 12px; }
      h2 { font-size: 11px; text-transform: uppercase; opacity: 0.6; margin: 14px 0 6px; }
      label { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; }
      #rules label { padding-left: 10px; }
      #rules.off { opacity: 0.4; }
      button { width: 100%; padding: 6px; margin-top: 12px; cursor: pointer; }
      button + button { margin-top: 6px; }
      button:disabled { cursor: default; }
      #shortcuts div { display: flex; justify-content: space-between; padding: 2px 0; opacity: 0.8; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <label>Close duplicates <input type="checkbox" id="dedupeEnabled" /></label>
    <h2>Dedupe domains</h2>
    <div id="rules"></div>
    <button data-action="sort-tabs">Sort now</button>
    <button data-action="close-duplicates" data-label="Close {n} duplicates">Close duplicates</button>
    <button data-action="close-stale" data-label="Close {n} tabs idle 1h+">Close tabs idle 1h+</button>
    <h2>Shortcuts <a href="#" id="editShortcut">change</a></h2>
    <div id="shortcuts"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
