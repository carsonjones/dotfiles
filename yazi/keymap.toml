# Yazi keymap overrides
# Docs: https://yazi-rs.github.io/docs/configuration/keymap

[mgr]
prepend_keymap = [
	# Vim-style :q to quit
	{ on = [":", "q"], run = "quit", desc = "Quit yazi" },
	# Fuzzy-find files/dirs rooted at the launch cwd (vs. Z, which follows you)
	{ on = "<C-p>", run = "plugin fzf-root", desc = "Fuzzy-find from launch dir" },
	# Focus the selected/current directory pane; press again to restore.
	{ on = "p", run = "plugin toggle-pane max-current", desc = "Focus current directory" },
	# Temporary files-only view for the current directory; Esc restores normal view.
	{ on = [ "g", "F" ], run = 'search_do --via=fd --args="-t f -d 1"', desc = "Files only in current dir" },
]
