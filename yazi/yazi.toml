# Yazi configuration
# Docs: https://yazi-rs.github.io/docs/configuration/yazi

[mgr]
# Pane width ratios: parent / current / preview.
# Set parent to 0 to collapse the left pane.
ratio          = [0, 2, 3]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "none"
show_hidden    = false
show_symlink   = true

[preview]
wrap = "yes"   # word-wrap text previews

# git.yazi — fetch git status for files and dirs in the current view
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
