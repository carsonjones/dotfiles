# Yazi theme — onedark (matches navarasu/onedark.nvim "dark" style)
# Schema: yazi 26.x
# Docs: https://yazi-rs.github.io/docs/configuration/theme

[mgr]
cwd = { fg = "#61afef" }

# Find
find_keyword  = { fg = "#e5c07b", bold = true, italic = true, underline = true }
find_position = { fg = "#c678dd", bg = "reset", bold = true, italic = true }

# Symlink
symlink_target = { fg = "#5c6370", italic = true }

# Marker (the colored bar to the left of marked rows)
marker_copied   = { fg = "#98c379", bg = "#98c379" }
marker_cut      = { fg = "#e86671", bg = "#e86671" }
marker_marked   = { fg = "#56b6c2", bg = "#56b6c2" }
marker_selected = { fg = "#e5c07b", bg = "#e5c07b" }
marker_symbol   = "│"

# Count chip (the "1/238" badge in the status bar — by action type)
count_copied   = { fg = "#282c34", bg = "#98c379" }
count_cut      = { fg = "#282c34", bg = "#e86671" }
count_selected = { fg = "#282c34", bg = "#e5c07b" }

# Border
border_symbol = "│"
border_style  = { fg = "#5c6370" }

syntect_theme = ""

[tabs]
active   = { fg = "#282c34", bg = "#61afef", bold = true }
inactive = { fg = "#abb2bf", bg = "#3e4452" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# Mode chip + the "alt" chip next to it (where "1/238" lives in normal mode)
[mode]
normal_main = { fg = "#282c34", bg = "#61afef", bold = true }
normal_alt  = { fg = "#abb2bf", bg = "#3e4452" }

select_main = { fg = "#282c34", bg = "#98c379", bold = true }
select_alt  = { fg = "#98c379", bg = "#3e4452" }

unset_main  = { fg = "#282c34", bg = "#d19a66", bold = true }
unset_alt   = { fg = "#d19a66", bg = "#3e4452" }

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "", close = "" }

[status]
overall   = {}
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions (drwxr-xr-x in the bottom right)
perm_sep   = { fg = "#5c6370" }
perm_type  = { fg = "#61afef" }
perm_read  = { fg = "#e5c07b" }
perm_write = { fg = "#e86671" }
perm_exec  = { fg = "#98c379" }

# Progress
progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#61afef", bg = "#3e4452" }
progress_error  = { fg = "#e86671", bg = "#3e4452" }

[input]
border   = { fg = "#61afef" }
title    = {}
value    = {}
selected = { reversed = true }

[confirm]
border     = { fg = "#61afef" }
title      = { fg = "#61afef" }
body       = {}
list       = {}
btn_yes    = { reversed = true }
btn_no     = {}

[pick]
border   = { fg = "#61afef" }
active   = { fg = "#c678dd", bold = true }
inactive = {}

[cmp]
border   = { fg = "#61afef" }
active   = { reversed = true }
inactive = {}

[tasks]
border  = { fg = "#61afef" }
title   = {}
hovered = { fg = "#c678dd", bold = true }

[which]
cols            = 3
mask            = { bg = "#282c34" }
cand            = { fg = "#56b6c2" }
rest            = { fg = "#abb2bf" }
desc            = { fg = "#c678dd" }
separator       = "  "
separator_style = { fg = "#5c6370" }

[help]
on      = { fg = "#56b6c2" }
run     = { fg = "#c678dd" }
desc    = { fg = "#abb2bf" }
hovered = { bg = "#3e4452", bold = true }
footer  = { fg = "#3e4452", bg = "#abb2bf" }

[notify]
title_info  = { fg = "#98c379" }
title_warn  = { fg = "#e5c07b" }
title_error = { fg = "#e86671" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#e5c07b" },

	# Media
	{ mime = "{audio,video}/*", fg = "#d19a66" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#c678dd" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#56b6c2" },

	# Fallback
	{ url = "*",  fg = "#abb2bf" },
	{ url = "*/", fg = "#61afef" },
]

# git.yazi — file status signs in the linemode
# Key names must match git.yazi's CODES: unstaged/staged/added/untracked/…
[git]
untracked = { fg = "#ebd096" }                # cream   — new, not yet tracked
added     = { fg = "#98c379" }                # green   — staged add
unstaged  = { fg = "#e5c07b" }                # yellow  — tracked, edited
staged    = { fg = "#98c379" }                # green   — tracked, staged
deleted   = { fg = "#e86671" }                # red
updated   = { fg = "#c678dd" }                # magenta — merge/rebase update
ignored   = { fg = "#5c6370" }                # gray
unknown   = { fg = "#5c6370" }
clean     = {}                                # no chrome for clean files

untracked_sign = "+"
added_sign     = "A"
unstaged_sign  = "M"
staged_sign    = "M"
deleted_sign   = "D"
updated_sign   = "U"
ignored_sign   = "!"
unknown_sign   = " "
clean_sign     = " "
